name: BiBoTracker Admin Screenshot Monitor

on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Folder name (06-10_AM, 08-20_AM, 12-55_PM, 02-00_PM, or auto)'
        required: false
        default: 'auto'
      tag:
        description: 'Optional screenshot tag (leave blank for auto detection)'
        required: false
        default: 'auto'
      zoom:
        description: 'Zoom level (defaults to 100% full scale)'
        required: false
        default: '100%'

permissions:
  contents: write

jobs:
  capture-screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Capture BiBoTracker screenshot
        env:
          BIBO_EMAIL: ${{ secrets.BIBO_EMAIL }}
          BIBO_PASSWORD: ${{ secrets.BIBO_PASSWORD }}
          BIBO_TARGET_URL: ${{ secrets.BIBO_TARGET_URL || 'https://bibotracker.com/admin' }}
          ZOOM_LEVEL: ${{ github.event.inputs.zoom || vars.ZOOM_LEVEL || '100%' }}
        run: |
          python take_screenshot.py --folder "${{ github.event.inputs.folder || 'auto' }}" --tag "${{ github.event.inputs.tag || 'auto' }}" --zoom "${{ env.ZOOM_LEVEL }}"

      - name: Commit and push screenshot to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add screenshots/
          if git diff --cached --quiet; then
            echo "No new screenshots to commit."
          else
            git commit -m "Auto-capture BiBoTracker: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: bibo-screenshots
          path: screenshots/
          retention-days: 30
